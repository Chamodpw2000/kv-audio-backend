# CI for kv-backend
name: kv-backend-ci
on:
    pull_request:
        branches:
            - k8s
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Set up node
          uses: actions/setup-node@v3
          with:
            node-version: '20'
        - name: Install dependencies
          run: npm install
        - name: Build project
          run: npm run build
        - name: Unit tests
          run: npm test 
    
    code-quality:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Run ESLint
          run: npm run lint
    
    docker:
        runs-on: ubuntu-latest
        needs: [build, code-quality]
        permissions:
          contents: write
          id-token: write
        env:
            AWS_REGION: ap-south-1
            ECR_REPOSITORY: kv_backend
            MANIFEST_REPOSITORY: Chamodpw2000/kv-audio-devops
            MANIFEST_BRANCH: main
            K8S_MANIFEST_PATH: k8s/backend/deployment.yaml
          
        steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v6
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}
        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2
        - name: Setup Docker Buildx
          uses: docker/setup-buildx-action@v3
        - name: Build and push Docker Image
          id: build-image
          env: 
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            IMAGE_TAG: ${{ github.sha }}
          run: |
            IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            echo "Building Docker image: $IMAGE_URI"
            docker build -t $IMAGE_URI .
            docker push $IMAGE_URI
            echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
            echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

        - name: Checkout Kubernetes manifest repo
          uses: actions/checkout@v4
          with:
            repository: ${{ env.MANIFEST_REPOSITORY }}
            ref: ${{ env.MANIFEST_BRANCH }}
            token: ${{ secrets.MANIFEST_REPO_TOKEN }}
            path: manifest-repo
        - name: Update Kubernetes manifest
          run: | 
             IMAGE_URI="${{ steps.build-image.outputs.image_uri }}"
             FILE="manifest-repo/${{ env.K8S_MANIFEST_PATH }}"

             echo "Updating $FILE with image: $IMAGE_URI"

             sed -i "s|image: .*|image: $IMAGE_URI|g" "$FILE"

             cat "$FILE"
        - name: Commit and push manifest changes
          working-directory: manifest-repo
          run: |
            git config user.name "chamodpw2000"
            git config user.email "mailtochamodw@gmail.com"

            git add "${{ env.K8S_MANIFEST_PATH }}"
            git commit -m "[CI] Update image to ${{ steps.build-image.outputs.image_tag }} " || echo "No changes to commit"
            git push origin ${{ env.MANIFEST_BRANCH }}